name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, unit and integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test tests/SharpChat.UnitTests --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ../coverage/backend
      - run: dotnet test tests/SharpChat.IntegrationTests --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ../coverage/backend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: coverage/backend
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, format, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    env:
      JWT_SIGNING_KEY: ci-only-signing-key-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile observability config --quiet
      - run: docker compose build
